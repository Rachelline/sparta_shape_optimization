site_name: SPARTA Shape Optimization
site_description: AD-linked DSMC shape-optimization framework built on SPARTA
site_url: https://rachelline.github.io/sparta_shape_optimization/
repo_url: https://github.com/Rachelline/sparta_shape_optimization
edit_uri: edit/master/

docs_dir: docs_site

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: STIX Two Text
    code: JetBrains Mono
  features:
    - navigation.tabs
    - navigation.top
    - content.action.edit
    - search.suggest

nav:
  - Overview: ad_src/README.md
  - AD Gradients: docs/AD_GRADIENTS.md
  - Verification Scripts: tools/ad_verify/README.md
  - Build (CMake): BUILD_CMAKE.md
  - Known Gaps: KNOWN_GAPS.md

markdown_extensions:
  - toc:
      permalink: true
  - tables
  - fenced_code
  - admonition
