name: AD

on:
  pull_request:
    branches: [ master ]
  workflow_dispatch:

# AD (Sacado forward-mode automatic differentiation) build + regression jobs,
# split out of main.yml so they can be run/watched independently of the
# stock/KOKKOS/MPI CI matrix (they are slower -- a from-source minimal-
# Trilinos build on cache miss -- and semantically distinct: verifying the
# -DSPARTA_ENABLE_AD build, not stock SPARTA).
#
# fmf-analytic-verify: Phases A+B of the AD-vs-analytic FMF ladder
#   (docs/PLAN.md). Runs on the STOCK build, no AD/Sacado needed -- proves
#   the closed-form kinetic-theory reference and its use against real DSMC
#   are both correct, before any AD derivative comparison relies on them.
# mpi-stubs-ad-sacado: builds -DSPARTA_ENABLE_AD=ON and runs the full
#   ctest gold-log regression suite against it. Three tests (thermostat,
#   thermostat_ave, collideInterspecies) are excluded via
#   SPARTA_DISABLED_TESTS in cmake/common/set/sparta_cmake_defaults.cmake --
#   NOT because they fail to build or crash, but because they are PROVEN
#   (by running the same inputs against the independent, previously-
#   validated hand-rolled sfloat AD reference) to inherently diverge from
#   the gold logs for any AD scalar substitution here, not a defect in this
#   fork. Every other test must still reproduce its gold log exactly.
jobs:
  fmf-analytic-verify:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4

    - name: Configure (stock serial)
      run: |
        mkdir build
        cd build
        cmake -C ../cmake/presets/serial.cmake \
          -DPKG_PYTHON=ON \
          ../cmake

    - name: Build
      run: cd build; make -j4

    - name: Phase A -- analytic reference self-test
      run: python3 tools/ad_verify/fmf_coeff.py

    - name: Phase B -- stock DSMC vs analytic FMF pressure
      run: SPARTA=$PWD/build/src/spa_serial python3 tools/ad_verify/flatplate_value_match.py

  mpi-stubs-ad-sacado:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4

    # Minimal Sacado (Sacado ONLY -- no Kokkos, this job doesn't build
    # PKG_KOKKOS), NOT the Ubuntu libtrilinos-sacado-dev apt package: that
    # package pulls in trilinos-dev (the full Trilinos suite) and is a stale
    # Trilinos 13.2.0, which violates the "only Sacado, not all of Trilinos"
    # build design (see docs/PLAN.md) and was never verified against SPARTA's
    # sfloat.h. Build+install once, cache across runs keyed on the pinned tag.
    - name: Cache minimal Trilinos/Sacado install
      id: sacado-cache
      uses: actions/cache@v4
      with:
        path: ${{ github.workspace }}/sacado-install
        key: sacado-17-0-0-nokokkos-ubuntu22.04-v1

    - name: Build minimal Sacado (Trilinos 17.0.0, Sacado only)
      if: steps.sacado-cache.outputs.cache-hit != 'true'
      run: |
        git clone --depth 1 --branch trilinos-release-17-0-0 \
          https://github.com/trilinos/Trilinos.git /tmp/Trilinos
        mkdir /tmp/trilinos-build && cd /tmp/trilinos-build
        cmake \
          -D CMAKE_BUILD_TYPE=RELEASE \
          -D CMAKE_INSTALL_PREFIX=${{ github.workspace }}/sacado-install \
          -D CMAKE_CXX_STANDARD=20 \
          -D BUILD_SHARED_LIBS=OFF \
          -D TPL_ENABLE_MPI=OFF \
          -D Trilinos_ENABLE_Fortran=OFF \
          -D Trilinos_ENABLE_ALL_PACKAGES=OFF \
          -D Trilinos_ENABLE_ALL_OPTIONAL_PACKAGES=OFF \
          -D Trilinos_ENABLE_TESTS=OFF \
          -D Trilinos_ENABLE_EXAMPLES=OFF \
          -D Trilinos_ENABLE_Sacado=ON \
          /tmp/Trilinos
        make -j4 install

    # Go through the real AD build gate (SPARTA_ENABLE_AD -> FindSacado.cmake
    # -> Sacado::Sacado + -DSPARTA_AD/-DSPARTA_AD_NDIR + C++17 bump), not a
    # manual -DSPARTA_AD compile flag -- that bypasses find_package(Sacado),
    # never links Sacado::Sacado, and skips the standard bump this build
    # needs (verified: C++17 is required and sufficient for AD without
    # Kokkos; see docs/PLAN.md).
    - name: Configure
      run: |
        mkdir build
        cd build
        cmake -C ../cmake/presets/serial.cmake \
          -DSPARTA_ENABLE_TESTING=ON \
          -DSPARTA_ENABLE_AD=ON \
          -DSACADO_ROOT=${{ github.workspace }}/sacado-install \
          -DPKG_PYTHON=ON \
          ../cmake

    - name: Build
      run: cd build; make -j4

    # ctest runs tools/testing/regression.py, comparing this AD build's
    # output against the same gold-standard logs the other jobs use, within
    # the existing numerical tolerance (1e-7). Three inputs are excluded via
    # SPARTA_DISABLED_TESTS (see file header); every other test must
    # reproduce stock SPARTA exactly, the same bar mpi-stubs-kokkos-exact-fft
    # holds the KOKKOS build to in main.yml.
    - name: Test
      run: |
        cd build
        find -name 'log.archive*'
        sudo rm /bin/sh
        sudo ln -s /bin/bash /bin/sh
        ctest --output-on-failure -j4

    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: 'mpi-stubs-ad-sacado-Artifacts'
        path: 'build/examples/'
