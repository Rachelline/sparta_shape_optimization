name: CI

on:
#  push:
#    branches: [ master ]
  pull_request:
    branches: [ master ]

# Define jobs: mpi, mpi-stubs-fft, mpi-stubs-kokkos-exact-fft, and bigbig
# Each jobs runs on ubuntu-22.04 and uses the cmake build system
# All jobs except for bigbig run ctest. The mpi-stubs-kokkos-exact-fft job runs
# the regression tests under KOKKOS ("-k on -sf kk") using the Serial backend
# and SPARTA_KOKKOS_EXACT so results match the non-KOKKOS gold-standard logs.
jobs:
  mpi:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4

    - name: Install Dependencies
      run: sudo apt install openmpi-bin libopenmpi-dev

    - name: Configure
      run: |
        mkdir build
        cd build
        cmake -C ../cmake/presets/mpi.cmake \
          -DSPARTA_ENABLE_TESTING=ON \
          -DPKG_PYTHON=ON \
          ../cmake

    - name: Build
      run: cd build; make -j4

    - name: Test
      run: |
        cd build
        find -name 'log.archive*'
        sudo rm /bin/sh
        sudo ln -s /bin/bash /bin/sh
        ctest --output-on-failure -j4

    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: 'mpi-Artifacts'
        path: 'build/examples/'
  mpi-stubs-fft:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4

    - name: Configure
      run: |
        mkdir build
        cd build
        cmake -C ../cmake/presets/serial.cmake \
          -DSPARTA_ENABLE_TESTING=ON \
          -DPKG_FFT=ON \
          -DPKG_PYTHON=ON \
           ../cmake

    - name: Build
      run: cd build; make -j4

    - name: Test
      run: |
        cd build
        find -name 'log.archive*'
        sudo rm /bin/sh
        sudo ln -s /bin/bash /bin/sh
        ctest --output-on-failure -j4

    #- uses: actions/upload-artifact@v4
    #  if: '!cancelled()'
    #  with:
    #    name: 'mpi-stubs-fft-Artifacts'
    #    path: 'build/examples/'
  mpi-stubs-kokkos-exact-fft:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4

    - name: Configure
      # Build the KOKKOS package with the Serial backend and SPARTA_KOKKOS_EXACT
      # so that KOKKOS reproduces the non-KOKKOS results exactly. This allows the
      # KOKKOS build to be regression tested against the existing (non-KOKKOS)
      # gold-standard log files. SPARTA_SPA_ARGS passes the KOKKOS command-line
      # args ("-k on -sf kk") to the sparta binary for every test.
      run: |
        mkdir build
        cd build
        cmake -C ../cmake/presets/serial.cmake \
          -DSPARTA_ENABLE_TESTING=ON \
          -DSPARTA_KOKKOS_EXACT=ON \
          -DPKG_KOKKOS=ON \
          -DKokkos_ENABLE_SERIAL=ON \
          -DKokkos_ENABLE_OPENMP=OFF \
          -DPKG_FFT=ON \
          -DPKG_PYTHON=ON \
          -DSPARTA_SPA_ARGS='-k on -sf kk' \
          ../cmake

    - name: Build
      run: cd build; make -j4

    - name: Test
      run: |
        cd build
        find -name 'log.archive*'
        sudo rm /bin/sh
        sudo ln -s /bin/bash /bin/sh
        ctest --output-on-failure -j4

    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: 'mpi-stubs-kokkos-exact-fft-Artifacts'
        path: 'build/examples/'
  mpi-stubs-ad-sacado:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4

    # Minimal Sacado (Sacado ONLY -- no Kokkos, this job doesn't build
    # PKG_KOKKOS), NOT the Ubuntu libtrilinos-sacado-dev apt package: that
    # package pulls in trilinos-dev (the full Trilinos suite) and is a stale
    # Trilinos 13.2.0, which violates the "only Sacado, not all of Trilinos"
    # build design (see docs/PLAN.md) and was never verified against SPARTA's
    # sfloat.h. Build+install once, cache across runs keyed on the pinned tag.
    - name: Cache minimal Trilinos/Sacado install
      id: sacado-cache
      uses: actions/cache@v4
      with:
        path: ${{ github.workspace }}/sacado-install
        key: sacado-17-0-0-nokokkos-ubuntu22.04-v1

    - name: Build minimal Sacado (Trilinos 17.0.0, Sacado only)
      if: steps.sacado-cache.outputs.cache-hit != 'true'
      run: |
        git clone --depth 1 --branch trilinos-release-17-0-0 \
          https://github.com/trilinos/Trilinos.git /tmp/Trilinos
        mkdir /tmp/trilinos-build && cd /tmp/trilinos-build
        cmake \
          -D CMAKE_BUILD_TYPE=RELEASE \
          -D CMAKE_INSTALL_PREFIX=${{ github.workspace }}/sacado-install \
          -D CMAKE_CXX_STANDARD=20 \
          -D BUILD_SHARED_LIBS=OFF \
          -D TPL_ENABLE_MPI=OFF \
          -D Trilinos_ENABLE_Fortran=OFF \
          -D Trilinos_ENABLE_ALL_PACKAGES=OFF \
          -D Trilinos_ENABLE_ALL_OPTIONAL_PACKAGES=OFF \
          -D Trilinos_ENABLE_TESTS=OFF \
          -D Trilinos_ENABLE_EXAMPLES=OFF \
          -D Trilinos_ENABLE_Sacado=ON \
          /tmp/Trilinos
        make -j4 install

    # Go through the real AD build gate (SPARTA_ENABLE_AD -> FindSacado.cmake
    # -> Sacado::Sacado + -DSPARTA_AD/-DSPARTA_AD_NDIR + C++17 bump), not a
    # manual -DSPARTA_AD compile flag -- that bypasses find_package(Sacado),
    # never links Sacado::Sacado, and skips the standard bump this build
    # needs (verified: C++17 is required and sufficient for AD without
    # Kokkos; see docs/PLAN.md).
    - name: Configure
      run: |
        mkdir build
        cd build
        cmake -C ../cmake/presets/serial.cmake \
          -DSPARTA_ENABLE_TESTING=ON \
          -DSPARTA_ENABLE_AD=ON \
          -DSACADO_ROOT=${{ github.workspace }}/sacado-install \
          -DPKG_PYTHON=ON \
          ../cmake

    - name: Build
      run: cd build; make -j4

    # ctest runs tools/testing/regression.py, comparing this AD build's
    # output against the same gold-standard logs the other jobs use, within
    # the existing numerical tolerance (1e-7). The AD build's value channel
    # must reproduce stock SPARTA exactly like mpi-stubs-kokkos-exact-fft
    # proves for the KOKKOS build above.
    - name: Test
      run: |
        cd build
        find -name 'log.archive*'
        sudo rm /bin/sh
        sudo ln -s /bin/bash /bin/sh
        ctest --output-on-failure -j4

    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: 'mpi-stubs-ad-sacado-Artifacts'
        path: 'build/examples/'
  bigbig:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4

    - name: Install Dependencies
      run: sudo apt install openmpi-bin libopenmpi-dev

    - name: Configure
      run: |
        mkdir build
        cd build
        cmake -C ../cmake/presets/kokkos_omp.cmake \
          -DPKG_FFT=ON \
          -DPKG_PYTHON=ON \
          -DSPARTA_DEFAULT_CXX_COMPILE_FLAGS='-DSPARTA_BIGBIG' \
          ../cmake

    - name: Build
      run: cd build; make -j4
